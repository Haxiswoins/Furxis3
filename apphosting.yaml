
# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
scheduledJobs:
  - schedule: "0 21 * * *" # Runs every day at 21:00 (9 PM) UTC.
    timeZone: "Asia/Shanghai"
    httpTarget:
      # This is an example of an httpTarget.
      # You can copy this and change the path and method to run your own scheduled jobs.
      path: /__run/notifyAdminOfPendingOrders
      method: "GET"
