<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Test</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="box"></canvas>
    <script src="/AestheticFluidBg.module.js"></script>
    <script>
        try {
            if (window.Color4Bg && window.Color4Bg.AestheticFluidBg) {
                new window.Color4Bg.AestheticFluidBg({
                    dom: "box",
                    colors: ["#ff5900", "#F0FFFE", "#194294", "#F0FFFE", "#58b3c6", "#F0FFFE"],
                    loop: true
                });
            } else {
                console.error('Color4Bg library not found on window object.');
                document.body.innerHTML = '<h1 style="font-family: sans-serif; color: red; text-align: center;">Error: Color4Bg library not found. Check the console.</h1>';
            }
        } catch (e) {
            console.error('Failed to initialize AestheticFluidBg:', e);
            document.body.innerHTML = '<h1 style="font-family: sans-serif; color: red; text-align: center;">Error: Failed to initialize. Check the console.</h1>';
        }
    </script>
</body>
</html>
